name: appunitime
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  file_picker: ^13.3.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # para carregar o ICON
  flutter_launcher_icons: ^0.14.4

# FUNÇÃO DO ICON
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/unitime_icon.png"
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
